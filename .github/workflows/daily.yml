name: Daily draft

# Builds the day's draft at 14:00 IST (08:30 UTC) so it is ready for you to review and post in the evening.
# It only ever writes DRAFTS. Nothing is posted anywhere. A failed run emails the repo owner (GitHub default).
on:
  schedule:
    - cron: "30 8 * * *"
    # Backups at 15:00, 16:00 and 17:00 IST (the Mac job in ops/ also starts it): GitHub can delay or drop scheduled runs. If the 14:00 IST run already made today's draft,
    # this one finds it and does nothing (it also never overwrites an APPROVED issue).
    - cron: "30 9 * * *"
    - cron: "30 10 * * *"   # 16:00 IST
    - cron: "30 11 * * *"   # 17:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's draft even if one already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests (a broken change must never reach a live draft)
        run: python -m unittest discover -s tests
      - name: Build the draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python -m pipeline.run --force; else python -m pipeline.run; fi
      - name: Show the review notes in the run summary
        if: always()
        run: |
          for f in drafts/*-review.md; do [ -e "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true
      - name: Commit the draft
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet || git commit -m "Draft for $(date -u +%F)"
          for i in 1 2 3; do git push && break; echo "push failed (attempt $i), retrying"; sleep 10; git pull --rebase origin main || true; done
          git diff origin/main --quiet || { echo "push did not land"; exit 1; }
