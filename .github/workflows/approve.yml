name: Approve issue

# Run this AFTER you have read and edited drafts/YYYY-MM-DD-issue.md and changed its line to "Status: APPROVED".
# It checks that you really did, builds the final LinkedIn post from YOUR edited text, and marks the issue
# approved. It refuses (and says why) if the status is not APPROVED, a placeholder is left, or too few items remain.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date, YYYY-MM-DD"
        required: true

permissions:
  contents: write

concurrency:
  group: approve
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check approval and build the final post
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: |
          set -eo pipefail   # so a refusal ("NOT APPROVED") fails the run instead of being hidden by tee
          [[ "$ISSUE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Date must look like 2026-11-03"; exit 1; }
          python -m pipeline.approve --date "$ISSUE_DATE" 2>&1 | tee approve.out
          { echo '### Approval result'; echo '```'; cat approve.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the approved files
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet || git commit -m "Approved $ISSUE_DATE"
          for i in 1 2 3; do git push && break; echo "push failed (attempt $i), retrying"; sleep 10; git pull --rebase origin main || true; done
          git diff origin/main --quiet || { echo "push did not land"; exit 1; }
